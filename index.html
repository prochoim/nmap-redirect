<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>지도로 이동</title>
  <style>body{font-family:-apple-system,sans-serif;padding:24px;text-align:center;color:#555}</style>
</head>
<body>
  <p>지도로 이동 중...</p>
  <p><small>모바일: 네이버 지도 앱 / 데스크톱: 카카오맵 길찾기</small></p>
  <script>
  (function(){
    var p = new URLSearchParams(window.location.search);
    var dlat = p.get('dlat');
    var dlng = p.get('dlng');
    var dname = p.get('dname') || '';
    var mode = p.get('mode');
    // 출발지 = 창동주공18단지 정문 정류장
    var slat = '37.6470';
    var slng = '127.0530';
    var sname = '집';
    var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
    var url;
    if (mode === 'desktop') {
      // 데스크톱(맥북)용: 카카오맵 공식 link API (path 기반, 검증된 형식)
      // 형식: /link/by/traffic/{출발지명},{lat},{lng}/{도착지명},{lat},{lng}
      if (dlat && dlng) {
        url = 'https://map.kakao.com/link/by/traffic/'
            + encodeURIComponent(sname) + ',' + slat + ',' + slng
            + '/'
            + encodeURIComponent(dname) + ',' + dlat + ',' + dlng;
      } else {
        url = 'https://map.kakao.com/link/search/' + encodeURIComponent(dname);
      }
    } else if (isMobile) {
      // 모바일: nmap:// 스킴 (검증됨)
      if (dlat && dlng) {
        url = 'nmap://route/public?slat=' + slat + '&slng=' + slng
            + '&sname=' + encodeURIComponent(sname)
            + '&dlat=' + dlat + '&dlng=' + dlng
            + '&dname=' + encodeURIComponent(dname)
            + '&appname=com.calendar.intake';
      } else {
        url = 'nmap://search?query=' + encodeURIComponent(dname)
            + '&appname=com.calendar.intake';
      }
    } else {
      // 데스크톱 + mode 없음: 네이버 지도 도착지 검색 페이지 fallback
      url = 'https://map.naver.com/p/search/' + encodeURIComponent(dname);
    }
    window.location.replace(url);
  })();
  </script>
</body>
</html>
