<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>네이버 지도로 이동</title>
  <style>body{font-family:-apple-system,sans-serif;padding:24px;text-align:center;color:#555}</style>
</head>
<body>
  <p>네이버 지도로 이동 중...</p>
  <p><small>모바일: 지도 앱 자동 실행 / 데스크톱: 길찾기 또는 검색 페이지</small></p>
  <script>
  (function(){
    var p = new URLSearchParams(window.location.search);
    var dlat = p.get('dlat');
    var dlng = p.get('dlng');
    var dname = p.get('dname') || '';
    var mode = p.get('mode');
    // 출발지 = 창동주공18단지 정문 정류장 (OSM 검증)
    var slat = '37.6470';
    var slng = '127.0530';
    var sname = '집';
    var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
    var url;
    if (mode === 'desktop') {
      // 데스크톱 길찾기 직접 시도 (작동 가변)
      if (dlat && dlng) {
        url = 'https://map.naver.com/p/?menu=route&pathType=2'
            + '&sname=' + encodeURIComponent(sname)
            + '&sx=' + slng + '&sy=' + slat
            + '&ename=' + encodeURIComponent(dname)
            + '&ex=' + dlng + '&ey=' + dlat;
      } else {
        url = 'https://map.naver.com/p/search/' + encodeURIComponent(dname);
      }
    } else if (isMobile) {
      if (dlat && dlng) {
        url = 'nmap://route/public?slat=' + slat + '&slng=' + slng
            + '&sname=' + encodeURIComponent(sname)
            + '&dlat=' + dlat + '&dlng=' + dlng
            + '&dname=' + encodeURIComponent(dname)
            + '&appname=com.calendar.intake';
      } else {
        url = 'nmap://search?query=' + encodeURIComponent(dname)
            + '&appname=com.calendar.intake';
      }
    } else {
      url = 'https://map.naver.com/p/search/' + encodeURIComponent(dname);
    }
    window.location.replace(url);
  })();
  </script>
</body>
</html>
